<!DOCTYPE html>
<html lang="pt">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        AV MARKET — Criar conta de revendedor
    </title>

    <link
        rel="stylesheet"
        href="../css/style-2.css"
    >

</head>


<body
    class="auth-page"
    data-screen="seller"
>


    <main class="auth-wrapper">


        <div
            class="auth-container auth-reversed"
            id="authContainer"
        >


            <!-- =========================================
                 PAINEL PRETO
            ========================================== -->

            <section class="auth-panel auth-panel-dark">


                <div
                    class="auth-content dark-content"
                >


                    <span class="brand-dark">
                        AV MARKET
                    </span>


                    <h2>
                        Revendedor.
                    </h2>


                    <p class="dark-subtitle">
                        A tua conta está quase pronta.
                    </p>


                    <button
                        type="button"
                        class="outline-button"
                        data-navigate="login.html"
                    >
                        Entrar
                    </button>


                </div>


            </section>



            <!-- =========================================
                 PAINEL CLARO
            ========================================== -->

            <section class="auth-panel auth-panel-light">


                <div
                    class="auth-content auth-register-content"
                >


                    <span class="brand-light">
                        AV MARKET
                    </span>


                    <h1>
                        Criar conta
                    </h1>


                    <p class="auth-subtitle">
                        Conta de revendedor.
                    </p>



                    <form
                        id="sellerRegisterForm"
                    >


                        <!-- NOME COMPLETO -->

                        <label for="sellerName">
                            Nome completo
                        </label>


                        <input
                            type="text"
                            id="sellerName"
                            name="name"
                            placeholder="Seu nome completo"
                            autocomplete="name"
                            required
                        >



                        <!-- E-MAIL -->

                        <label for="sellerEmail">
                            E-mail
                        </label>


                        <input
                            type="email"
                            id="sellerEmail"
                            name="email"
                            placeholder="Seu e-mail"
                            autocomplete="email"
                            required
                        >



                        <!-- TELEFONE / WHATSAPP -->

                        <label for="sellerPhone">
                            Telefone / WhatsApp
                        </label>


                        <input
                            type="tel"
                            id="sellerPhone"
                            name="phone"
                            placeholder="+244 9XX XXX XXX"
                            autocomplete="tel"
                            required
                        >



                        <!-- PALAVRA-PASSE -->

                        <label for="sellerPassword">
                            Palavra-passe
                        </label>


                        <div class="password-field">


                            <input
                                type="password"
                                id="sellerPassword"
                                name="password"
                                placeholder="Sua palavra-passe"
                                autocomplete="new-password"
                                required
                            >


                            <button
                                type="button"
                                class="password-toggle"
                                data-password-toggle="sellerPassword"
                                aria-label="Mostrar palavra-passe"
                            >
                                ●
                            </button>


                        </div>



                        <!-- CONFIRMAR PALAVRA-PASSE -->

                        <label for="sellerConfirmPassword">
                            Confirmar palavra-passe
                        </label>


                        <div class="password-field">


                            <input
                                type="password"
                                id="sellerConfirmPassword"
                                name="confirmPassword"
                                placeholder="Confirme a palavra-passe"
                                autocomplete="new-password"
                                required
                            >


                            <button
                                type="button"
                                class="password-toggle"
                                data-password-toggle="sellerConfirmPassword"
                                aria-label="Mostrar palavra-passe"
                            >
                                ●
                            </button>


                        </div>



                        <!-- TERMOS E POLÍTICA -->

                        <label
                            class="accept-contract register-terms"
                            for="sellerTerms"
                        >


                            <input
                                type="checkbox"
                                id="sellerTerms"
                                name="terms"
                                required
                            >


                            <span>

                                Aceito os
                                <a
                                    href="termos-utilizacao.html"
                                    target="_blank"
                                >
                                    Termos de Utilização
                                </a>
                                e a
                                <a
                                    href="politica-privacidade.html"
                                    target="_blank"
                                >
                                    Política de Privacidade
                                </a>
                                da AV.

                            </span>


                        </label>



                        <!-- BOTÃO -->

                        <button
                            type="submit"
                            class="primary-button"
                            id="sellerCreateButton"
                        >
                            Criar conta
                        </button>


                        <p
                            class="form-message"
                            id="sellerRegisterMessage"
                        ></p>


                    </form>


                </div>


            </section>


        </div>


    </main>



    <script
        src="../js/script-2.js"
    ></script>


</body>

</html>
