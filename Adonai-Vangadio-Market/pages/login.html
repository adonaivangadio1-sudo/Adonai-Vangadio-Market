<!DOCTYPE html>
<html lang="pt">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>AV MARKET — Entrar</title>

    <link
        rel="stylesheet"
        href="../css/style-2.css"
    >

</head>


<body
    class="auth-page"
    data-screen="login"
>


    <main class="auth-wrapper">


        <div
            class="auth-container"
            id="authContainer"
        >


            <!-- =========================================
                 PAINEL CLARO — LOGIN
            ========================================== -->

            <section class="auth-panel auth-panel-light">

                <div class="auth-content">

                    <span class="brand-light">
                        AV MARKET
                    </span>


                    <h1>
                        Entrar
                    </h1>


                    <p class="auth-subtitle">
                        Bem-vindo de volta.
                    </p>


                    <form id="loginForm">


                        <label for="loginEmail">
                            E-mail
                        </label>


                        <input
                            type="email"
                            id="loginEmail"
                            name="email"
                            placeholder="Seu e-mail"
                            autocomplete="email"
                            required
                        >


                        <label for="loginPassword">
                            Palavra-passe
                        </label>


                        <div class="password-field">

                            <input
                                type="password"
                                id="loginPassword"
                                name="password"
                                placeholder="Sua palavra-passe"
                                autocomplete="current-password"
                                required
                            >


                            <button
                                type="button"
                                class="password-toggle"
                                data-password-toggle="loginPassword"
                                aria-label="Mostrar palavra-passe"
                            >
                                ●
                            </button>

                        </div>


                        <a
                            href="recuperar-senha.html"
                            class="forgot-password"
                        >
                            Esqueceu a palavra-passe?
                        </a>


                        <button
                            type="submit"
                            class="primary-button"
                            id="loginButton"
                        >
                            Entrar
                        </button>


                        <p
                            class="form-message"
                            id="loginMessage"
                        ></p>


                    </form>

                </div>

            </section>



            <!-- =========================================
                 PAINEL PRETO — CRIAR CONTA
            ========================================== -->

            <section class="auth-panel auth-panel-dark">

                <div class="auth-content dark-content">


                    <span class="brand-dark">
                        AV MARKET
                    </span>


                    <h2>
                        Olá, amigo.
                    </h2>


                    <p class="dark-subtitle">

                        Ainda não tens uma conta?<br>
                        Cria já a tua.

                    </p>


                    <div class="account-options">


                        <!-- COMPRADOR -->

                        <button
                            type="button"
                            class="account-button"
                            data-navigate="criar-conta-comprador.html"
                        >

                            <span>
                                Criar conta
                            </span>

                            <strong>
                                Comprador
                            </strong>

                        </button>



                        <!-- REVENDEDOR -->

                        <button
                            type="button"
                            class="account-button"
                            data-navigate="contrato-revendedor.html"
                        >

                            <span>
                                Criar conta
                            </span>

                            <strong>
                                Revendedor
                            </strong>

                        </button>


                    </div>


                </div>

            </section>


        </div>


    </main>



    <div
        class="page-transition"
        id="pageTransition"
    ></div>



    <!-- ANIMAÇÃO -->
    <script
        src="../js/script-2.js"
    ></script>


    <!-- AUTENTICAÇÃO INTELIGENTE -->
    <script
        type="module"
        src="../js/script-3.js"
    ></script>


</body>

</html>
