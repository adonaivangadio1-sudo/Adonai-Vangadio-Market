<!DOCTYPE html>
<html lang="pt">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>AV MARKET — Criar conta</title>

    <link
        rel="stylesheet"
        href="../css/style-2.css"
    >

</head>


<body
    class="auth-page"
    data-screen="buyer"
>


    <main class="auth-wrapper">


        <div
            class="auth-container auth-reversed"
            id="authContainer"
        >


            <section class="auth-panel auth-panel-dark">

                <div class="auth-content dark-content">

                    <span class="brand-dark">
                        AV MARKET
                    </span>

                    <h2>
                        Bem-vindo.
                    </h2>

                    <p class="dark-subtitle">
                        Já tens uma conta?
                    </p>

                    <button
                        type="button"
                        class="outline-button"
                        data-navigate="login.html"
                    >
                        Entrar
                    </button>

                </div>

            </section>


            <section class="auth-panel auth-panel-light">

                <div class="auth-content">

                    <span class="brand-light">
                        AV MARKET
                    </span>

                    <h1>
                        Criar conta
                    </h1>

                    <p class="auth-subtitle">
                        Conta de comprador.
                    </p>


                    <form
                        id="buyerRegisterForm"
                    >


                        <label for="buyerName">
                            Nome
                        </label>

                        <input
                            type="text"
                            id="buyerName"
                            name="name"
                            placeholder="Seu nome"
                            autocomplete="name"
                            required
                        >


                        <label for="buyerEmail">
                            E-mail
                        </label>

                        <input
                            type="email"
                            id="buyerEmail"
                            name="email"
                            placeholder="Seu e-mail"
                            autocomplete="email"
                            required
                        >


                        <label for="buyerPassword">
                            Palavra-passe
                        </label>


                        <div class="password-field">

                            <input
                                type="password"
                                id="buyerPassword"
                                name="password"
                                placeholder="Sua palavra-passe"
                                autocomplete="new-password"
                                required
                            >


                            <button
                                type="button"
                                class="password-toggle"
                                data-password-toggle="buyerPassword"
                                aria-label="Mostrar palavra-passe"
                            >
                                ●
                            </button>

                        </div>


                        <button
                            type="submit"
                            class="primary-button"
                            id="buyerCreateButton"
                        >
                            Criar conta
                        </button>


                        <p
                            class="form-message"
                            id="buyerRegisterMessage"
                        ></p>


                    </form>

                </div>

            </section>


        </div>

    </main>


    <div
        class="page-transition"
        id="pageTransition"
    ></div>


<script src="../js/script-2.js"></script>

<script
    type="module"
    src="../js/script-3.js"
></script>

</body>

</html>
